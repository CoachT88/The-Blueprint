<script>
/* The drawer. Every destination above is a real anchor, so with JavaScript
   off the markup is still a complete, crawlable list of links; only the
   open and close behaviour needs this. */
(function(){
  var body=document.body,tog=document.getElementById('sn-toggle'),
      close=document.getElementById('sn-close'),scrim=document.getElementById('sn-scrim'),
      drawer=document.getElementById('sn-drawer'),learn=document.querySelector('.sn-learn'),
      learnBtn=document.getElementById('sn-learn-btn');
  if(!tog||!drawer) return;
  /* hidden is removed once the script runs, so a no-JS visitor never sees a
     drawer they cannot close. */
  drawer.hidden=false; if(scrim) scrim.hidden=false;
  var last=null;
  function open(){
    last=document.activeElement;
    body.setAttribute('data-sn-open','true');
    tog.setAttribute('aria-expanded','true');
    var f=drawer.querySelector('a,button'); if(f) f.focus();
  }
  function shut(){
    body.removeAttribute('data-sn-open');
    tog.setAttribute('aria-expanded','false');
    if(last&&last.focus) last.focus();
  }
  tog.addEventListener('click',open);
  if(close) close.addEventListener('click',shut);
  if(scrim) scrim.addEventListener('click',shut);
  drawer.addEventListener('click',function(e){ if(e.target.closest('a')) shut(); });
  function setLearn(v){
    if(!learn) return;
    learn.setAttribute('data-open',v?'true':'false');
    if(learnBtn) learnBtn.setAttribute('aria-expanded',v?'true':'false');
  }
  if(learnBtn) learnBtn.addEventListener('click',function(e){
    e.stopPropagation(); setLearn(learn.getAttribute('data-open')!=='true');
  });
  document.addEventListener('click',function(e){
    if(learn&&!learn.contains(e.target)) setLearn(false);
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    setLearn(false);
    if(body.getAttribute('data-sn-open')==='true') shut();
  });
  /* Keep focus inside the drawer while it is modal. */
  drawer.addEventListener('keydown',function(e){
    if(e.key!=='Tab'||body.getAttribute('data-sn-open')!=='true') return;
    var f=drawer.querySelectorAll('a,button');
    if(!f.length) return;
    var first=f[0],lastEl=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();lastEl.focus();}
    else if(!e.shiftKey&&document.activeElement===lastEl){e.preventDefault();first.focus();}
  });
  /* Mark the current page, from the URL, so no page carries a hand-set flag
     that goes stale when it is copied to the next one. */
  var here=location.pathname.replace(/index\.html$/,'');
  document.querySelectorAll('.sn-links a,.sn-drawer a').forEach(function(a){
    var h=a.getAttribute('href')||'';
    if(h.charAt(0)==='/'&&h!=='/'&&h===here) a.setAttribute('aria-current','page');
  });
})();
</script>
