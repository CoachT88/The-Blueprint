name: Tests

# Two speeds, matching how the suites are actually used:
#   every push  — unit + syntax, about a second, no browser. Catches a syntax
#                 break, a stray markdown fence or a duplicate element id at once.
#   pull request: the whole suite including the browser files, before
#                 anything merges.
#
# Deliberately no `paths:` filter. index.html is the whole app, so there is no
# change that should be allowed to skip these.

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and syntax tests
        run: npm test

  e2e:
    name: Browser suites
    runs-on: ubuntu-latest
    # Only on pull requests: 20 files open a browser each and run serially, so
    # this is minutes rather than seconds. Every merge still passes through it.
    if: github.event_name == 'pull_request'
    # The JOB budget covers setup as well as the suite. It used to be 20, and
    # that is what cancelled the run on PR #134: `Install Chromium` took 619s
    # on a cache miss, against 23s on the three runs before it, so the suite
    # had 581s of the budget left for work that needs about 630s. Nothing
    # failed. The job simply ran out of clock during setup's bad day, and
    # because a cancelled job skips `Post Cache Chromium`, the cache was never
    # re-saved either, which would have made the next run miss again.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci installs the playwright package but not the browser binary, and
      # the harness has no /opt fallback on a runner, so this is required.
      # Keyed on the resolved version rather than the ^range so a lockfile bump
      # invalidates the cache.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.1
          # So an evicted or renamed exact key still restores a usable browser
          # instead of paying the full download again.
          restore-keys: |
            playwright-chromium-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite gets its own budget, so slow setup can never eat it and a
      # genuinely hanging test is still cut promptly. It runs in about 630s on
      # a runner, so 20 minutes is roughly double, which is a real ceiling
      # rather than a number chosen to make a red run go green.
      - name: Run browser suites
        timeout-minutes: 20
        run: npm run test:e2e
