name: Disposable CAS wire proof

# Pull-request-only temporary PostgreSQL + PostgREST. No live Supabase references.
on:
  pull_request:
    paths:
      - .github/workflows/disposable-cas-proof.yml
      - tests/integration/disposable-cas-*

jobs:
  disposable-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      postgrest:
        image: postgrest/postgrest:v12.2.12
        env:
          PGRST_DB_URI: postgresql://postgres:disposable_only@postgres:5432/postgres
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: web_anon
          PGRST_SERVER_PORT: 3000
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install temporary psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply schema to DISPOSABLE PostgreSQL ONLY
        env:
          PGPASSWORD: disposable_only
        run: psql -h 127.0.0.1 -p 15432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/integration/disposable-cas-setup.sql
      - name: Drive actual PostgREST HTTP upserts and check atomic revision semantics
        run: node tests/integration/disposable-cas-proof.mjs
