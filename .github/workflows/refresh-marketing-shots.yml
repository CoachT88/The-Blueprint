name: Refresh genuine app screenshots

on:
  push:
    branches:
      - phase3-real-app-screens-2026-10-26
    paths:
      - tools/capture-marketing-screenshots.mjs
      - .github/workflows/refresh-marketing-shots.yml
  pull_request:
    paths:
      - tools/capture-marketing-screenshots.mjs
      - .github/workflows/refresh-marketing-shots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture the actual app with fictional demo data
        run: node tools/capture-marketing-screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: current-app-marketing-screenshots
          path: |
            img/shot-home.jpg
            img/shot-mission.jpg
            img/shot-recovery.jpg
            img/shot-progress.jpg
      - name: Commit new captures to the feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/shot-home.jpg img/shot-mission.jpg img/shot-recovery.jpg img/shot-progress.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh authentic PWA screenshots from demo session [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
