name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  # Manual redeploy. Without this the only ways to reach production are to
  # re-run a past run or invent a commit that touches supabase/functions,
  # which is a poor position to be in when a deploy has been failing and you
  # are trying to confirm a fix.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy send-notifications
        run: supabase functions deploy send-notifications --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
