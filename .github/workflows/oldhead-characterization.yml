name: Old-head V1/V2 characterization

# Synthetic V2 fixture only. Runs the unchanged application in Chromium.
on:
  push:
    branches:
      - audit/old-client-v2-journey-proof
  pull_request:
    paths:
      - .github/workflows/oldhead-characterization.yml
      - tests/e2e/v1-v2-oldhead-characterization.test.js

jobs:
  old-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.1
          restore-keys: |
            playwright-chromium-
      - run: npx playwright install --with-deps chromium
      - name: Run ONLY the four old-client observations
        timeout-minutes: 10
        run: E2E=1 npx vitest run tests/e2e/v1-v2-oldhead-characterization.test.js --reporter=verbose
